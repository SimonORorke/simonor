[package]
name = "simonor"
version = "0.1.0"
edition = "2024"

[dependencies]
simonor-core = { version = "0.1.0", path = "crates/simonor-core" }
simonor-testing = { version = "0.1.0", path = "crates/simonor-testing", optional = true }

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }

[features]
default = ["testing"]
testing = ["dep:simonor-testing"]

[workspace]
members = [
    ".",
    "crates/simonor-core",
    "crates/simonor-testing",
]
